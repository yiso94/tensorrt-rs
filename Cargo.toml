[workspace]
members = [
    "tensorrt",
    "tensorrt_llm",
    "tensorrt_llm-sys",
    "tensorrt-sys",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
description = "Rust bindings for NVIDIA TensorRT and TensorRT-LLM."
homepage = "https://github.com/yiso94/tensorrt-rs"
repository = "https://github.com/yiso94/tensorrt-rs.git"
readme = "README.md"
license = "MIT"
keywords = ["tensorrt", "cuda", "candle", "inference", "llm"]
categories = ["api-bindings", "external-ffi-bindings", "science"]

[workspace.dependencies]
candle-core = { version = "0.10.2", default-features = false }
cc = "1.2.61"
cudarc = { version = "0.19.4", default-features = false, features = ["driver", "f16"] }
half = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smallvec = "1.15.1"
tensorrt = { path = "tensorrt", version = "0.1.0" }
tensorrt-sys = { path = "tensorrt-sys", version = "0.1.0" }
tensorrt-llm-sys = { path = "tensorrt_llm-sys", version = "0.1.0" }
